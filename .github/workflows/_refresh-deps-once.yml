name: One-time frontend dependency refresh

on:
  push:
    branches: [refactor/v3]
    paths:
      - ".github/workflows/_refresh-deps-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[refresh-deps-once]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply non-breaking security updates
        run: npm audit fix
      - name: Verify dependency tree and build
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: Commit refreshed lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            git add frontend/package.json frontend/package-lock.json
            git commit -m "fix(deps): remediate frontend npm advisories"
            git push origin HEAD:refactor/v3
          else
            echo "No dependency changes were required."
          fi
