name: V3 browser smoke

on:
  push:
    branches: ["refactor/v3"]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/v3-browser-smoke.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Desktop and mobile browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ZHILIB_LIBRARY_DIR: ${{ runner.temp }}/zhiwei-e2e-library
      ZHIWEI_E2E_ARTIFACTS: ${{ github.workspace }}/artifacts/browser-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build isolated frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and Chromium
        run: |
          python -m pip install -e "./backend[dev]"
          python -m playwright install chromium --with-deps
      - name: Seed synthetic library and verify desktop/mobile flows
        run: |
          set -euo pipefail
          cd backend
          python - <<'PY'
          from app.services.library import import_markdown
          article = import_markdown("e2e.md", "# V3 浏览器验收文章\n\n这是一篇 CI 生成的测试文章，用于验证阅读和资料库界面。".encode())
          print("Created synthetic article:", article["id"])
          PY
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 > "$RUNNER_TEMP/zhiwei-uvicorn.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ -o /dev/null
          python tests/e2e_browser.py
      - name: Collect isolated browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-browser-smoke
          path: |
            artifacts/browser-smoke/
            ${{ runner.temp }}/zhiwei-uvicorn.log
          if-no-files-found: ignore
