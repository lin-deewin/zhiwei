function shell(){const nav=(items)=>items.map(([icon,label,page])=>`<button class="nav-item ${state.page===page?'active':''}" data-page="${page}" aria-current="${state.page===page?'page':'false'}">${ico(icon,17)}<span>${label}</span>${page==='library'?'<em>1,286</em>':''}</button>`).join('');return `<div class="app"><div class="sidebar-scrim ${state.mobileNav?'open':''}" data-action="close-nav"></div><aside class="sidebar ${state.mobileNav?'open':''}"><div class="brand" data-page="home"><div class="brand-logo">${ico('layers',22)}</div><div class="brand-word">知微<small>Knowledge, thoughtfully.</small></div></div><div class="sidebar-content"><div class="nav-heading">我的工作台</div>${nav(navMain)}<div class="nav-heading">知识探索</div>${nav(navExplore)}<div class="nav-separator"></div>${nav([['sync','同步中心','sync'],['settings','偏好设置','settings']])}</div><div class="sidebar-foot"><div class="account-row" data-page="settings"><div class="account-avatar">知</div><div><b>我的知识空间</b><small>本地优先 · 个人资料库</small></div>${ico('more',17)}</div></div></aside><div class="main"><header class="topbar"><div class="crumbs"><button class="icon-btn mobile-menu" data-action="open-nav" aria-label="打开菜单">${ico('menu',20)}</button><span>个人空间</span><span class="slash">/</span><strong>${escapeHtml(pageName())}</strong></div><div class="top-actions"><span class="demo-ribbon">交互原型 · 示例数据</span><button class="global-search-button" data-action="command" aria-label="打开全局搜索">${ico('search',15)}<span>搜索任何内容...</span><kbd>⌘ K</kbd></button><span class="status-line"><i class="status-dot"></i> 本地就绪</span><button class="icon-btn" data-action="theme" aria-label="切换明暗主题">${ico(state.theme==='light'?'moon':'sun',18)}</button></div></header><main class="workspace">${pageContent()}</main></div></div>${state.modal?modal():''}${state.command?command():''}${state.toast?`<div class="toast" role="status">${ico('check',16)}<span>${escapeHtml(state.toast)}</span></div>`:''}`}
function header(eyebrow,title,sub,actions=''){return `<div class="page-header"><div><div class="page-eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subtitle">${sub}</p></div><div class="header-actions">${actions}</div></div>`}
function articleGlyph(a){return `<div class="article-glyph glyph-${a.tone}">${ico('book',18)}</div>`}
function articleRow(a,index=0){return `<div class="article-row ${index===0?'first':''}" data-read="${a.id}">${articleGlyph(a)}<div class="article-row-body"><div class="article-row-title">${escapeHtml(a.title)}</div><div class="article-row-desc">${escapeHtml(a.desc)}</div></div><div class="meta-inline"><span class="tag">${escapeHtml(a.cat)}</span><span>${escapeHtml(a.date)}</span></div><span class="arrow">${ico('chevron',16)}</span></div>`}
function overview(){return `${header('MONDAY · YOUR KNOWLEDGE','让知识，慢慢生长。','整理你收藏的好内容，把灵感变成可以持续积累的认知。',`<button class="btn" data-page="sync">${ico('sync',15)} 同步收藏</button><button class="btn primary" data-page="library">打开文章库 ${ico('arrow',14)}</button>`)}<div class="stats"><div class="panel stat"><div class="metric-label">${ico('library',16)} 收录文章</div><strong>1,286</strong><small><span class="positive">↑ 32</span> 本月新增</small></div><div class="panel stat"><div class="metric-label">${ico('tag',16)} 已整理主题</div><strong>24</strong><small>涵盖 6 个知识领域</small></div><div class="panel stat"><div class="metric-label">${ico('note',16)} 我的笔记</div><strong>89</strong><small>每次思考都有归处</small></div><div class="panel stat"><div class="metric-label">${ico('book',16)} 待整理文章</div><strong>17</strong><small><span class="positive">↓ 8</span> 比上周减少</small></div></div><div class="overview-grid"><div><div class="section-title"><h2>最近收录</h2><button class="subtle-link" data-page="library">查看全部 ${ico('arrow',14)}</button></div><section class="panel list-panel">${articles.slice(0,5).map(articleRow).join('')}</section><div class="section-title" style="margin-top:29px"><h2>继续探索</h2><button class="subtle-link" data-page="knowledge">我的知识空间 ${ico('arrow',14)}</button></div><div class="panel" style="padding:19px 21px;display:flex;align-items:center;gap:15px"><div class="icon-soft" style="width:47px;height:47px">${ico('network',21)}</div><div style="flex:1"><b style="font-size:13px">个人知识管理方法论</b><p style="color:#98a69b;font-size:11px;margin:5px 0 0">关联 12 篇文章 · 6 条笔记</p></div><button class="btn small" data-page="knowledge">继续整理 ${ico('arrow',13)}</button></div></div><div class="overview-right"><section class="panel mini-panel"><div class="section-title"><h2>我的主题</h2><button class="subtle-link" data-page="categories">管理 ${ico('arrow',13)}</button></div><div class="topic-list">${topics.slice(0,5).map(t=>`<button class="topic-item" data-topic="${escapeHtml(t.name)}"><i class="dot" style="background:${t.color}"></i><strong>${t.name}</strong><small>${t.count} 篇</small></button>`).join('')}</div></section><section class="panel mini-panel"><div class="section-title"><h2>同步状态</h2><span class="badge grey">${ico('check',12)} 已完成</span></div><div class="mini-sync"><div class="sync-icon">${ico('sync',21)}</div><div><strong>最近同步成功</strong><small>11 月 8 日  ·  新增 12 篇</small></div></div><button class="btn full-action" data-page="sync">查看同步中心 ${ico('arrow',14)}</button></section></div></div>`}
function library(){let arr=articles.filter(a=> (state.filter==='全部'||state.filter===a.cat||state.filter===a.source)&&(a.title+a.desc+a.cat).toLowerCase().includes(state.query.toLowerCase()));if(state.sort==='title')arr=[...arr].sort((a,b)=>a.title.localeCompare(b.title,'zh-CN'));const actions=`<button class="btn" data-action="import">${ico('upload',15)} 导入 Markdown</button><button class="btn primary" data-page="sync">${ico('sync',15)} 同步知乎</button>`;return `${header('MY LIBRARY','文章库','集中阅读、检索和管理你的收藏内容。',actions)}<div class="toolbar"><div class="filters"><label class="filter-input">${ico('search',15)}<input id="article-search" type="search" value="${escapeHtml(state.query)}" placeholder="搜索文章、主题、关键词" autocomplete="off"/></label><select id="category-filter" class="select"><option value="全部">全部内容</option>${topics.map(t=>`<option ${state.filter===t.name?'selected':''} value="${t.name}">${t.name}</option>`).join('')}<option ${state.filter==='知乎回答'?'selected':''}>知乎回答</option><option ${state.filter==='本地导入'?'selected':''}>本地导入</option></select></div><div class="filters"><select id="sort-select" class="select"><option value="recent" ${state.sort==='recent'?'selected':''}>最近收录</option><option value="title" ${state.sort==='title'?'selected':''}>按标题排序</option></select><div class="segmented"><button data-view="list" class="${state.view==='list'?'on':''}" aria-label="列表视图">${ico('list',15)}</button><button data-view="grid" class="${state.view==='grid'?'on':''}" aria-label="卡片视图">${ico('grid',15)}</button></div></div></div>${arr.length ? state.view==='list'?`<div class="panel"><div class="table-head"><span>文章</span><span>主题</span><span>来源</span><span>收录时间</span><span></span></div>${arr.map(a=>`<div class="table-row"><div style="min-width:0"><button class="table-title" data-read="${a.id}">${escapeHtml(a.title)}</button><div class="table-excerpt">${escapeHtml(a.desc)}</div></div><div><span class="tag">${a.cat}</span></div><span class="cell-text">${a.source}</span><span class="cell-text">${a.date}</span><button class="icon-btn" data-read="${a.id}" aria-label="阅读文章">${ico('chevron',16)}</button></div>`).join('')}</div>`:`<div class="table-grid">${arr.map(a=>`<div class="panel grid-article" data-read="${a.id}">${articleGlyph(a)}<h3>${escapeHtml(a.title)}</h3><p>${escapeHtml(a.desc)}</p><div class="grid-foot"><span class="tag">${a.cat}</span><span>${a.read}</span></div></div>`).join('')}</div>`:`<div class="panel empty"><h3>没有找到匹配的文章</h3><p>尝试更换搜索关键词或筛选条件。</p><button class="btn" data-action="reset-search">重置筛选</button></div>`}<p class="footer-count">当前展示 ${arr.length} 篇示例文章 · 真实项目共 1,286 篇为演示占位数值</p>`}
function reader(){const a=articles.find(x=>x.id===state.articleId)||articles[0];return `<div class="reader-shell"><div class="reader-top"><button class="btn ghost" data-page="library">${ico('left',16)} 返回文章库</button><div class="header-actions"><button class="btn" data-action="save-article">${ico('bookmark',15)} ${a.saved?'已加入重点':'加入重点'}</button><button class="btn" data-action="copy-link">${ico('external',15)} 复制文章链接</button><button class="btn primary" data-action="toggle-notes">${ico('panel',15)} 笔记面板</button></div></div><div class="reader-columns"><article class="reader-paper"><div class="reader-type">${escapeHtml(a.cat)} · ${escapeHtml(a.source)}</div><h1>${escapeHtml(a.title)}</h1><div class="reader-byline"><span>${escapeHtml(a.author)}</span><span>·</span><span>${escapeHtml(a.date)}</span><span>·</span><span>${escapeHtml(a.read)}阅读</span></div><div class="reader-cover">${ico('layers',47)}</div><div class="reader-copy"><p>${escapeHtml(a.desc)} 本篇示例文章用于展示知微重构后的沉浸式阅读体验。真正的正文内容在连接项目 API 后显示。</p><h2 id="section1">一、从信息收集到知识理解</h2><p>我们每天都会遇到大量值得收藏的内容，但一篇文章被收藏，并不意味着它已经被理解。真正有价值的阅读，是在接触新观点之后，重新用自己的语言解释它，并找到与已有经验之间的关系。</p><p>一个好的知识工作台，应当让阅读本身成为主要任务。界面保持安静，导航和管理操作退居次要位置，让用户的注意力停留在内容、线索以及正在形成的思考上。</p><blockquote>重要的不是保存了多少内容，而是多少内容真正改变了你的理解。</blockquote><h2 id="section2">二、为每一条知识建立连接</h2><p>当阅读与主题、笔记以及研究成果产生关联时，资料库便不再是孤立的文章集合。主题帮助你定位知识，双向链接帮助你理解关系，笔记留下那些只属于你自己的判断。</p><p>这也是知微新界面设计的出发点：阅读页保留专注的版心，右侧放置可按需收起的知识上下文。所有重要操作都应当在恰当的时机出现。</p><h2 id="section3">三、让工具服务于思考</h2><p>界面上的按钮越多，并不意味着能力越强。好的设计应该把同一性质的操作收纳到一起，让用户在最少的判断和跳转中完成自己的目标。</p><p>下一个阶段，我们可以把阅读选区、高亮、私人笔记、AI 解释以及知识链接统一放在右侧上下文面板中，避免重复弹窗与工具条。</p></div></article><aside class="reader-side" id="reader-side"><div class="panel"><h3>本文目录</h3><button class="toc-btn active" data-anchor="section1">01 从信息收集到知识理解</button><button class="toc-btn" data-anchor="section2">02 为每一条知识建立连接</button><button class="toc-btn" data-anchor="section3">03 让工具服务于思考</button></div><div class="panel"><h3>阅读笔记</h3><textarea id="reader-note" class="note-area" placeholder="在这里记录一闪而过的想法..."></textarea><button class="btn" data-action="save-reader-note">${ico('note',14)} 保存到我的笔记</button></div><div class="panel"><h3>AI 阅读助手</h3><p style="font-size:11px;color:#91a095;margin:0">让 AI 提炼要点、解释概念，所有结果附带原文来源。</p><button class="btn" data-action="reader-ai">${ico('sparkle',14)} 生成内容摘要</button></div></aside></div></div>`}
function categories(){return `${header('KNOWLEDGE TAXONOMY','主题目录','以清晰的分类结构组织所有文章，减少信息碎片。',`<button class="btn" data-action="new-category">${ico('plus',15)} 新建主题</button><button class="btn primary" data-action="auto-classify">${ico('sparkle',15)} 智能整理</button>`)}<div class="page-tabs"><button class="page-tab active">全部主题</button><button class="page-tab" data-action="pending">待整理 <span style="color:#9bafa0">17</span></button></div><div class="category-grid">${topics.map(t=>`<div class="panel category-card" data-topic="${t.name}"><div class="category-top"><div class="icon-soft" style="background:${t.color}1b;color:${t.color}">${ico('folder',19)}</div><span class="side-note">${t.count} 篇</span></div><h3>${t.name}</h3><p>${t.sub}</p><div class="category-foot">查看主题文章 ${ico('arrow',14)}</div></div>`).join('')}</div><div class="panel" style="margin-top:22px;padding:20px;display:flex;align-items:center;gap:14px"><div class="icon-soft" style="background:#fcf4e6;color:#ae9164">${ico('layers',18)}</div><div style="flex:1"><b style="font-size:13px">还有 17 篇文章等待整理</b><p style="font-size:11px;color:#9ba49d;margin:5px 0 0">把新收藏归入一个主题，或者交给 AI 协助分类。</p></div><button class="btn" data-action="pending">查看待整理 ${ico('arrow',14)}</button></div>`}
function questionsPage(){const arr=questions.filter(q=>state.activeTopic==='全部主题'||q.cat===state.activeTopic);return `${header('CURATED QUESTIONS','话题汇总','一个好问题，往往可以带你发现一整个知识领域。',`<button class="btn" data-action="rebuild-topics">${ico('sync',15)} 更新话题关联</button>`)}<div class="chips" style="margin-bottom:23px"><button class="chip ${state.activeTopic==='全部主题'?'chosen':''}" data-question-topic="全部主题">全部主题</button>${topics.map(t=>`<button class="chip ${state.activeTopic===t.name?'chosen':''}" data-question-topic="${t.name}">${t.name}</button>`).join('')}</div><div class="split-grid"><section class="panel">${arr.length?arr.map(q=>`<div class="topic-card" data-action="open-question"><div class="icon-soft">${ico('topic',19)}</div><div style="flex:1"><h3>${q.title}</h3><p>${q.desc}</p><div class="chips"><span class="tag">${q.cat}</span><span style="font-size:11px;color:#98a69c;padding:3px 0">已收藏 ${q.count} 个回答</span></div></div>${ico('chevron',16)}</div>`).join(''):`<div class="empty">这个主题下暂无示例话题。</div>`}</section><aside><div class="panel mini-panel"><div class="section-title"><h2>浏览建议</h2></div><p style="font-size:12px;color:#879b8c;line-height:2">从问题出发，不仅可以阅读已经收藏的回答，也能在知乎原话题中发现新的思考角度。</p><button class="btn" style="width:100%" data-page="library">查看关联文章 ${ico('arrow',14)}</button></div></aside></div>`}
function notesPage(){const current=notes.find(n=>n.id===state.noteId)||notes[0];return `${header('PERSONAL NOTES','我的笔记','记录阅读时产生的想法，让每次思考都留下痕迹。',`<button class="btn primary" data-action="new-note">${ico('plus',15)} 新建笔记</button>`)}<div class="notes-layout"><div class="panel notes-list">${notes.map(n=>`<div class="notes-item ${n.id===state.noteId?'selected':''}" data-note="${n.id}"><strong>${escapeHtml(n.title)}</strong><p>${escapeHtml(n.body).slice(0,70)}...</p><small>${n.date} · ${n.tag}</small></div>`).join('')}</div><div class="panel notes-detail"><div class="header-actions" style="justify-content:flex-end"><span class="tag">${current.tag}</span><button class="icon-btn" data-action="edit-note" aria-label="编辑笔记">${ico('edit',16)}</button></div><h2>${escapeHtml(current.title)}</h2><div class="muted">${current.date}  ·  关联文章 ${current.article?'1':'0'} 篇</div>${current.body.split('\n').filter(Boolean).map(p=>`<p>${escapeHtml(p)}</p>`).join('')}<button class="subtle-link" data-read="${current.article||1}" style="margin-top:20px">${ico('book',14)} 查看关联文章 ${ico('arrow',13)}</button></div></div>`}
function knowledge(){const n=knowledgeNodes.find(x=>x.id===state.knowledgeId)||knowledgeNodes[0];return `${header('CONNECTED KNOWLEDGE','知识空间','把文章、笔记、研究成果连接为一套不断生长的知识网络。',`<button class="btn primary" data-action="new-knowledge">${ico('plus',15)} 新建知识页</button>`)}<div class="knowledge-layout"><div class="panel knowledge-tree"><h3>我的知识页</h3>${knowledgeNodes.map(n=>`<button class="tree-item ${state.knowledgeId===n.id?'selected':''}" data-knowledge="${n.id}">${ico('note',15)} ${n.title}</button>`).join('')}<div class="nav-separator"></div><button class="tree-item" data-action="markdown">${ico('download',15)} Markdown 导入与互通</button><button class="tree-item" data-action="project">${ico('layers',15)} 持续研究项目</button></div><div class="panel knowledge-detail"><div class="page-eyebrow">KNOWLEDGE PAGE  /  双向链接</div><h2>${n.title}</h2><p>${n.desc}</p><h3 style="font-size:13px;margin:29px 0 8px">已连接的资料</h3>${n.links.map(link=>`<div class="backlink">${ico('network',15)} &nbsp; ${link}</div>`).join('')}<button class="btn" style="margin-top:25px" data-action="edit-knowledge">${ico('edit',15)} 编辑知识页</button></div></div>`}
function ask(){return `${header('ASSISTED RESEARCH','AI 研究','把资料库中的证据组织成可以追溯的答案。',`<button class="btn" data-action="history">${ico('clock',15)} 研究历史</button>`)}<div class="ask-hero"><div class="ask-star">${ico('sparkle',22)}</div><h1>有什么想深入理解的？</h1><p>从你的文章、笔记和知识页中查找证据，生成有出处的研究答案。</p></div><div class="ask-box"><textarea id="ask-input" placeholder="试着提出一个问题，例如：如何构建稳定的 AI Agent 软件工程体系？">${escapeHtml(state.aiQuestion)}</textarea><div class="ask-box-foot"><span style="font-size:11px;color:#9eaba0">${ico('library',14)}  检索我的知识库 · 演示模式</span><button class="btn primary" data-action="ask-answer">开始研究 ${ico('arrow',15)}</button></div></div><div class="suggestions">${['如何构建个人知识管理系统？','软件架构的核心设计原则有哪些？','AI Agent 如何实现长期记忆？'].map(q=>`<button class="chip" data-suggest="${q}">${q}</button>`).join('')}</div>${state.aiAnswered?`<div class="panel ai-answer"><h3>${ico('sparkle',17)} 研究摘要 <span class="tag" style="margin-left:8px">演示结果</span></h3><p>针对“${escapeHtml(state.aiQuestion||'你的问题')}”，可以从三个角度组织思考：先明确需要解决的具体问题，再把相关信息归纳为可维护的知识结构，最后建立检验与迭代机制。</p><p>在真实系统中，这个位置会显示基于文章、个人笔记与知识页的检索结果，并对每个关键结论给出出处。</p><div class="evidence">${ico('quote',14)} 引用来源示例 ·《构建自己的知识系统》 ·《AI Agent 的知识、记忆与任务编排》</div><button class="btn" data-action="save-ai-note" style="margin-top:17px">${ico('note',14)} 转为研究笔记</button></div>`:''}`}
function syncPage(){return `${header('DATA & SYNC','同步中心','安全地将知乎收藏保存到本地，并查看每次同步的详细过程。',`<span class="badge">${ico('check',13)} 知乎账户已连接（演示）</span>`)}<div class="sync-layout"><div><section class="panel sync-panel"><h2>选择同步方式</h2><p>同步模式可以随时切换。实际数据操作需在正式项目中连接后端。</p><label class="sync-choice ${state.syncMode==='incremental'?'selected':''}"><input type="radio" name="sync-mode" value="incremental" ${state.syncMode==='incremental'?'checked':''}/><div><strong>增量同步 <span class="tag" style="margin-left:7px">推荐</span></strong><small>只下载新收藏或需要更新的内容</small></div></label><label class="sync-choice ${state.syncMode==='full'?'selected':''}"><input type="radio" name="sync-mode" value="full" ${state.syncMode==='full'?'checked':''}/><div><strong>全量同步</strong><small>重新检查所有收藏，不覆盖已有的手动笔记</small></div></label><div style="margin:20px 0 12px"><b style="font-size:12px">同步范围</b><p style="font-size:11px;color:#a4ada6;margin:6px 0 0">已选择：全部收藏夹（示例）</p></div><div style="border:1px solid var(--line);padding:12px;border-radius:8px;font-size:12px;color:#718476">${ico('folder',17)} &nbsp; ~/Documents/ZhihuLibrary</div><button class="btn primary" style="margin-top:20px;width:100%" data-action="run-sync">${ico('sync',15)} ${state.syncProgress>0&&state.syncProgress<100?'正在运行演示...':'启动同步演示'}</button>${state.syncProgress>0?`<div class="progress-track"><div style="width:${state.syncProgress}%"></div></div><div class="side-note">示例任务进度：${state.syncProgress}% · 未向知乎发送任何请求</div>`:''}</section></div><section class="panel sync-panel"><h2>最近同步任务</h2><p>任务结果、错误及重试操作都会集中显示。</p>${[{title:state.syncProgress>0?'交互原型同步演示':'增量同步',date:state.syncProgress>0?'当前会话 · 示例任务':'11 月 8 日 · 下载 12 篇，跳过 238 篇',status:state.syncProgress>0&&state.syncProgress<100?'运行中':'已完成'},{title:'自动主题整理',date:'11 月 7 日 · 完成 26 篇分类',status:'已完成'},{title:'全量同步',date:'11 月 5 日 · 已检查 1,248 篇',status:'已完成'}].map(j=>`<div class="job"><div class="icon-soft">${ico('sync',17)}</div><div><strong>${j.title}</strong><small>${j.date}</small></div><div><span class="badge grey">${j.status}</span></div></div>`).join('')}<p class="side-note" style="margin:19px 0 0">演示数据不代表已登录知乎，也不会写入你的真实资料库。</p></section></div>`}
function settings(){return `${header('PREFERENCES','偏好设置','管理界面体验、资料目录与账户连接。')}<div class="settings-layout"><section class="panel setting-card"><h3 style="font-size:14px;margin:0 0 7px">外观偏好</h3><div class="setting-row"><div><strong>显示主题</strong><small>适应不同光线下的阅读体验</small></div><select class="select" id="theme-select"><option value="light" ${state.theme==='light'?'selected':''}>浅色模式</option><option value="dark" ${state.theme==='dark'?'selected':''}>深色模式</option></select></div><div class="setting-row"><div><strong>内容密度</strong><small>调整文章列表的行距和信息密度</small></div><select class="select" id="density-select"><option value="comfortable" ${state.density==='comfortable'?'selected':''}>舒适</option><option value="compact" ${state.density==='compact'?'selected':''}>紧凑</option></select></div></section><section class="panel setting-card"><h3 style="font-size:14px;margin:0 0 8px">本地资料库</h3><div class="setting-row"><div><strong>存储路径</strong><small>~/Documents/ZhihuLibrary</small></div><button class="btn" data-action="storage">更改目录</button></div><div class="setting-row"><div><strong>知乎连接</strong><small>扫码登录、会话状态与收藏范围</small></div><button class="btn" data-page="sync">管理连接 ${ico('arrow',13)}</button></div></section><section class="panel setting-card"><h3 style="font-size:14px;margin:0 0 8px">设计原型说明</h3><p style="color:#87978b;font-size:12px;line-height:1.9;margin:0">本原型是独立的静态交互样例，不读取真实账号、文章或配置。页面结构、排版和组件交互用于评审；确认后再映射到现有 React + TypeScript 项目。</p></section></div>`}
function pageContent(){switch(state.page){case'home':return overview();case'library':return library();case'reader':return reader();case'categories':return categories();case'questions':return questionsPage();case'notes':return notesPage();case'knowledge':return knowledge();case'ask':return ask();case'sync':return syncPage();case'settings':return settings();default:return overview()}}
function modal(){const type=state.modal;let title='',body='',buttons='';if(type==='import'){title='导入 Markdown 文件';body=`<p>在原型里可选择本地 Markdown 或 TXT 文件，立即预览为一篇新文章。仅当前浏览器会话有效。</p><label class="form-label" for="file-upload">选择文件</label><input id="file-upload" type="file" class="field" accept=".md,.markdown,.txt"/>`;buttons=`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm-import">导入预览</button>`}else if(type==='note'||type==='edit-note'){const note=type==='edit-note'?notes.find(n=>n.id===state.noteId):null;title=note?'编辑笔记':'新建笔记';body=`<label class="form-label">笔记标题</label><input class="field" id="note-title" placeholder="输入笔记标题" value="${escapeHtml(note?.title||'')}"/><label class="form-label">笔记内容</label><textarea class="field" style="height:140px;resize:vertical" id="note-body" placeholder="写下你的思考...">${escapeHtml(note?.body||'')}</textarea>`;buttons=`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm-note">保存笔记</button>`}else{title='功能交互演示';body='<p>这个入口在交互原型中展示其位置、信息层级和交互反馈。正式功能会在设计确认后接入现有项目 API，不对真实数据执行修改。</p>';buttons=`<button class="btn primary" data-action="close-modal">了解</button>`}return `<div class="modal-backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}" ><h2>${title}</h2>${body}<div class="modal-footer">${buttons}</div></div></div>`}
function command(){const q=state.commandQuery||'';const options=[...navMain,...navExplore,['sync','同步中心','sync'],['settings','偏好设置','settings']];const filtered=options.filter(n=>n[1].includes(q)||q==='');const aa=articles.filter(a=>a.title.includes(q)&&q);return `<div class="command-backdrop" data-action="close-command"><div class="command" ><div class="command-input">${ico('search',21)}<input autofocus id="command-input" placeholder="搜索页面、文章或功能..." value="${escapeHtml(q)}"/></div>${[...filtered.map(n=>`<div class="command-result" data-page="${n[2]}">${ico(n[0],17)}<span>${n[1]}</span>${ico('arrow',14)}</div>`),...aa.slice(0,4).map(a=>`<div class="command-result" data-read="${a.id}">${ico('book',17)}<span>${a.title}</span>${ico('arrow',14)}</div>`)].slice(0,10).join('')||'<div class="empty" style="padding:26px">没有匹配结果</div>'}<div class="command-help">Enter / 点击打开 · Esc 关闭 · ⌘ K 快速检索</div></div></div>`}
function render(){document.body.classList.toggle('dark',state.theme==='dark');document.body.classList.toggle('compact',state.density==='compact');root.innerHTML=shell();if(state.command){requestAnimationFrame(()=>{const el=document.getElementById('command-input');el?.focus();el?.setSelectionRange(el.value.length,el.value.length)})}}
const delegated=(e)=>{const el=e.target.closest('[data-page],[data-read],[data-note],[data-knowledge],[data-topic],[data-question-topic],[data-view],[data-anchor],[data-suggest],[data-action]');if(!el)return;const {page,read,note,knowledge,topic,questionTopic,view,anchor,suggest,action}=el.dataset;if(page){go(page);return}if(read){state.articleId=Number(read);go('reader');return}if(note){state.noteId=Number(note);render();return}if(knowledge){state.knowledgeId=Number(knowledge);render();return}if(topic){state.filter=topic;go('library');state.filter=topic;render();return}if(questionTopic){state.activeTopic=questionTopic;render();return}if(view){state.view=view;render();return}if(anchor){document.getElementById(anchor)?.scrollIntoView({behavior:'smooth',block:'start'});return}if(suggest){state.aiQuestion=suggest;state.aiAnswered=false;render();document.getElementById('ask-input')?.focus();return}if(!action)return;if((action==='close-modal'||action==='close-command')&&e.target!==el)return;
 switch(action){case'open-nav':state.mobileNav=true;render();break;case'close-nav':state.mobileNav=false;render();break;case'theme':state.theme=state.theme==='light'?'dark':'light';render();break;case'command':state.command=true;state.commandQuery='';render();break;case'close-command':state.command=false;render();break;case'import':state.modal='import';render();break;case'new-note':state.modal='note';render();break;case'edit-note':state.modal='edit-note';render();break;case'close-modal':state.modal=null;render();break;case'confirm-note':{const title=document.getElementById('note-title')?.value?.trim(),body=document.getElementById('note-body')?.value?.trim();if(!title){document.getElementById('note-title')?.focus();return}if(state.modal==='edit-note'){const n=notes.find(x=>x.id===state.noteId);n.title=title;n.body=body||''}else{const id=Math.max(...notes.map(n=>n.id))+1;notes.unshift({id,title,body:body||'',date:'刚刚',tag:'个人笔记',article:0});state.noteId=id}state.modal=null;go('notes');alertDemo('笔记已保存到原型的临时会话');break}case'confirm-import':{const input=document.getElementById('file-upload'),f=input?.files?.[0];if(!f){input?.focus();return}if(f.size>2*1024*1024){alertDemo('原型仅支持 2 MB 以内的文件');return}f.text().then(content=>{const title=(content.match(/^#\s+(.+)$/m)||[])[1]||f.name.replace(/\.(md|markdown|txt)$/i,'');const id=Math.max(...articles.map(a=>a.id))+1;articles.unshift({id,title,desc:content.replace(/[#>*`\n]/g,' ').slice(0,100),cat:'知识管理',source:'本地导入',date:'刚刚',read:'约 5 分钟',tone:'green',author:'本地文档',saved:false});state.modal=null;go('library');alertDemo('文件已导入原型（刷新后将恢复示例数据）')});break}case'copy-link':{const value=location.href.split('#')[0]+'#article-'+state.articleId;const p=navigator.clipboard?.writeText(value);if(p)p.then(()=>alertDemo('原型页面链接已复制')).catch(()=>alertDemo('当前环境无法复制链接'));else alertDemo('当前环境无法复制链接');break}case'save-article':{const a=articles.find(x=>x.id===state.articleId);a.saved=!a.saved;alertDemo(a.saved?'已加入重点阅读':'已取消重点阅读');break}case'toggle-notes':{const p=document.getElementById('reader-side');p?.classList.toggle('hidden');break}case'save-reader-note':{const body=document.getElementById('reader-note')?.value.trim();if(!body){alertDemo('请先输入阅读笔记内容');return}const id=Math.max(...notes.map(n=>n.id))+1;notes.unshift({id,title:'阅读摘记 · '+articles.find(x=>x.id===state.articleId)?.title.slice(0,17),body,date:'刚刚',tag:'阅读笔记',article:state.articleId});alertDemo('阅读笔记已保存到临时会话');break}case'ask-answer':{state.aiQuestion=document.getElementById('ask-input')?.value.trim()||'如何构建个人知识管理系统？';state.aiAnswered=true;render();break}case'save-ai-note':{const id=Math.max(...notes.map(n=>n.id))+1;notes.unshift({id,title:'研究记录 · '+state.aiQuestion.slice(0,18),body:'研究摘要：明确问题，组织可靠资料，建立可持续的检验与迭代机制。\n\n（演示内容，不包含真实 AI 生成。）',date:'刚刚',tag:'研究笔记',article:1});state.noteId=id;go('notes');alertDemo('演示研究记录已存入笔记');break}case'run-sync':{if(state.syncTimer)return;state.syncProgress=1;render();let step=0;state.syncTimer=setInterval(()=>{step++;state.syncProgress=Math.min(100,step*10);render();if(step>=10){clearInterval(state.syncTimer);state.syncTimer=null;alertDemo('同步演示完成：没有访问知乎或写入真实数据')}},550);break}case'reset-search':state.query='';state.filter='全部';render();break;default:state.modal='generic';render();break}}
root.addEventListener('click',delegated);
root.addEventListener('input',e=>{if(e.target.id==='article-search'){const pos=e.target.selectionStart;state.query=e.target.value;render();const input=document.getElementById('article-search');input?.focus();try{input?.setSelectionRange(pos,pos)}catch(_){}}else if(e.target.id==='command-input'){const pos=e.target.selectionStart;state.commandQuery=e.target.value;render();const input=document.getElementById('command-input');input?.focus();try{input?.setSelectionRange(pos,pos)}catch(_){}}});
root.addEventListener('change',e=>{if(e.target.id==='category-filter'){state.filter=e.target.value;render()}else if(e.target.id==='sort-select'){state.sort=e.target.value;render()}else if(e.target.id==='theme-select'){state.theme=e.target.value;render()}else if(e.target.id==='density-select'){state.density=e.target.value;render()}else if(e.target.name==='sync-mode'){state.syncMode=e.target.value;render()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.command=!state.command;state.commandQuery='';render()}if(e.key==='Escape'){if(state.command){state.command=false;render()}else if(state.modal){state.modal=null;render()}else if(state.mobileNav){state.mobileNav=false;render()}}});
render();
</script>
</body>
</html>
