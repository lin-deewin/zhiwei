[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zhihu-library"
version = "0.1.0"
description = "Local-first Zhihu favorites library"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6,<7",
  "playwright>=1.48,<2",
  "httpx>=0.27,<1",
  "requests>=2.31,<3",
  "qrcode[pil]>=7.4,<9",
  "beautifulsoup4>=4.12,<5",
  "markdownify>=0.13,<2",
  "fastembed>=0.7,<1",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
